<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character & Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Character & Word Counter</h1>
        <p class="subtitle">Type something below and see the counts update instantly.</p>

        <textarea
            id="textInput"
            placeholder="Start typing here..."
            maxlength="5000"
        ></textarea>

        <div class="counter-box">
            <div class="counter">
                <span id="charCount">0</span>
                <p>Characters</p>
            </div>

            <div class="counter">
                <span id="wordCount">0</span>
                <p>Words</p>
            </div>

            <div class="counter">
                <span id="sentenceCount">0</span>
                <p>Sentences</p>
            </div>
        </div>

        <div class="bottom">
            <span id="remaining">5000 characters remaining</span>
            <button id="clearBtn">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
